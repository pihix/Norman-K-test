name: FrontEnd CI/CD

on:
  push:
    branches: ["pipeline-frontend-CI-CD"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_ci.yml"
  pull_request:
    branches: ["pipeline-frontend-CI-CD"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_ci.yml"
  workflow_dispatch:

jobs:
  frontend_ci:
    name: FrontEnd CI
    uses: ./.github/workflows/frontend_ci.yml
    secrets: inherit

