name: Continuous Deployment

on:
  workflow_call:

env:
  AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
# All continuous deployment jobs should be defined here
# They will run after all the CI jobs are completed successfully
jobs:
  deploy-backend:
    name: Deploy to ECS
    concurrency: ${{ github.ref_name }}-backend
    runs-on: ubuntu-latest

    env:
      CLUSTER: cluster-ecs-normank
      SERVICE: service-ecs-normank
      TASK_FAMILY: task-df-normank
      CONTAINER_NAME: normank-backend

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # taskdef.json: version de référence (déposée dans repo), on ne remplace que l'image
      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend/ecs/taskdef.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.AWS_ECR_REGISTRY }}/normank/backend:${{ github.sha }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.SERVICE }}
          cluster: ${{ env.CLUSTER }}
          wait-for-service-stability: true
