name: Backend CI (Maven)

on:
  push:
    branches: ["dev"]
    paths:
      - "backend/**"
      - ".github/workflows/backend_ci_maven.yaml"
  pull_request:
    branches: ["dev"]
    paths:
      - "backend/**"
      - ".github/workflows/backend_ci_maven.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21" # ou '17' selon le projet
  ARTIFACT_NAME: Norman-K-Backend
  WORKDIR: backend/api
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  EB_APP_NAME: norman-k-backend
  EB_ENV_NAME: norman-k-backend-env
  S3_BUCKET: eb-artifacts-norman-k
  TRIGGER: "Test_trigger"

jobs:
  build_test:
    name: Build & Test (Backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Maven Wrapper present
        run: |
          if [ ! -f "./mvnw" ]; then
            echo "::warning::mvnw non trouvé. On utilisera mvn système."
          fi

      - name: Show versions
        run: |
          java -version
          ./mvnw -v || mvn -v

      - name: Unit tests
        run: |
          chmod +x mvnw || true
          ./mvnw -B -ntp -DskipTests=false test || mvn -B -ntp -DskipTests=false test

      - name: Package (Jar)
        run: |
          ./mvnw -B -ntp -DskipTests package || mvn -B -ntp -DskipTests package

      - name: Collect JAR
        id: jar_path
        run: |
          FILE=$(ls -1 target/*.jar | head -n1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORKDIR }}/${{ steps.jar_path.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  docker_build_push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: build_test

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/norman-k-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: Norman-K-Backend
          path: backend/api/target

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/norman-k-backend
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} backend/api

      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: docker_build_push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags & image
        id: vars
        run: |
          echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/norman-k-backend:${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Generate Dockerrun.aws.json
        run: |
          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": { "Name": "${{ steps.vars.outputs.image }}", "Update": "true" },
            "Ports": [ { "ContainerPort": 8080 } ]
          }
          EOF
          zip bundle.zip Dockerrun.aws.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload bundle to S3
        run: aws s3 cp bundle.zip s3://${{ env.S3_BUCKET }}/bundle-${{ steps.vars.outputs.sha }}.zip

      - name: Create EB application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APP_NAME }}" \
            --version-label "${{ steps.vars.outputs.sha }}" \
            --source-bundle S3Bucket="${{ env.S3_BUCKET }}",S3Key="bundle-${{ steps.vars.outputs.sha }}.zip"

      - name: Update EB environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENV_NAME }}" \
            --version-label "${{ steps.vars.outputs.sha }}"

      - name: Show EB URL
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name "${{ env.EB_APP_NAME }}" \
            --environment-names "${{ env.EB_ENV_NAME }}" \
            --query "Environments[0].CNAME" --output text

