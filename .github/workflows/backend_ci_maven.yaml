name: Backend CI (Maven)

on:
  push:
    branches: ["dev"]
    paths:
      - "backend/**"
      - ".github/workflows/backend_ci_maven.yaml"
  pull_request:
    branches: ["dev"]
    paths:
      - "backend/**"
      - ".github/workflows/backend_ci_maven.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21" # ou '17' selon le projet
  ARTIFACT_NAME: Norman-K-Backend
  WORKDIR: backend/api

jobs:
  build_test:
    name: Build & Test (Backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Maven Wrapper present
        run: |
          if [ ! -f "./mvnw" ]; then
            echo "::warning::mvnw non trouvé. On utilisera mvn système."
          fi

      - name: Show versions
        run: |
          java -version
          ./mvnw -v || mvn -v

      - name: Unit tests
        run: |
          chmod +x mvnw || true
          ./mvnw -B -ntp -DskipTests=false test || mvn -B -ntp -DskipTests=false test

      - name: Package (Jar)
        run: |
          ./mvnw -B -ntp -DskipTests package || mvn -B -ntp -DskipTests package

      - name: Collect JAR
        id: jar_path
        run: |
          FILE=$(ls -1 target/*.jar | head -n1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORKDIR }}/${{ steps.jar_path.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  docker_build_push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: build_test

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/norman-k-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: Norman-K-Backend
          path: backend/api/target

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/norman-k-backend
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} backend/api

      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

  integration_test:
    name: Integration Test with Docker Compose
    runs-on: ubuntu-latest
    needs: docker_build_push
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_TAG env
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Bring up stack (backend/)
        working-directory: backend
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> .env
          echo "GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}" >> .env
          docker compose -f docker-compose.yml -f docker-compose.dependencies.yml up -d
          docker compose ps

      - name: Wait & health check
        run: |
          # attend jusqu'à 60s max que l'app réponde
          for i in {1..12}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then
              echo "Health OK"; exit 0
            fi
            echo "waiting..."; sleep 5
          done
          echo "App did not become healthy in time"; exit 1

      - name: Dump logs on failure
        if: failure()
        working-directory: backend
        run: |
          echo "=== APP LOGS ==="
          docker compose logs app || true
          echo "=== DB LOGS ==="
          docker compose logs db || true

      - name: Tear down
        if: always()
        working-directory: backend
        run: docker compose -f docker-compose.yml -f docker-compose.dependencies.yml down -v
