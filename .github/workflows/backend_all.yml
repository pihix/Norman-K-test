name: BackEnd CI/CD

on:
  push:
    branches: ["pipeline-backend-CI-CD"]
    paths:
      - "backend/**"
      - ".github/workflows/backend*"
  pull_request:
    branches: ["pipeline-backen-CI-CD"]
    paths:
      - "backend/**"
      - ".github/workflows/backend*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_ci:
    name: BackEnd CI
    uses: ./.github/workflows/backend_ci.yml
    secrets: inherit

  backend_cd:
    name: BackEnd CD
    needs: backend_ci
    uses: ./.github/workflows/backend_cd.yml
    secrets: inherit
