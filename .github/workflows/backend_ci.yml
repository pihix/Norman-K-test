name: BackEnd CI

on:
  workflow_call:

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  WORKDIR: backend/api
  AWS_REGION: ${{ secrets.AWS_REGION }}

  AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
  AWS_ECR_FRONTEND_REPOSITORY: "normank/backend"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  tests_package:
    name: Tests & Package
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test
        run: ../mvnw -B -ntp clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ${{ env.PROJECT_DIR }}/target/*.jar
          retention-days: 1

      - name: Jacoco summary (optional)
        if: always()
        uses: madrapps/jacoco-report@v1.6
        continue-on-error: true
        with:
          paths: ${{ env.PROJECT_DIR }}/target/site/jacoco/jacoco.xml
          token: ${{ github.token }}
          min-coverage-overall: "85"
          min-coverage-changed-files: "85"
