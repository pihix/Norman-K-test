name: BackEnd CI

on:
  workflow_call:

env:
  JAVA_VERSION: "21" # ou '17' selon le projet
  ARTIFACT_NAME: backend-jar
  WORKDIR: backend/api
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  AWS_REGION: ${{ secrets.AWS_REGION }}

  AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
  AWS_ECR_BACKEND_REPOSITORY: "normank/backend"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_test:
    name: Build & Test (Backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      #   - name: Build, Test & Package
      #     run: mvn -B -ntp clean verify

      - name: Verify Maven Wrapper present
        run: |
          if [ ! -f "./mvnw" ]; then
            echo "::warning::mvnw non trouvé. On utilisera mvn système."
          fi

      - name: Show versions
        run: |
          java -version
          ./mvnw -v || mvn -v

      - name: Unit tests
        run: |
          chmod +x mvnw || true
          ./mvnw -B -ntp -DskipTests=false test || mvn -B -ntp -DskipTests=false test

      - name: Package (Jar)
        run: |
          ./mvnw -B -ntp -DskipTests package || mvn -B -ntp -DskipTests package

      - name: Collect JAR
        id: jar_path
        run: |
          FILE=$(ls -1 target/*.jar | head -n1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORKDIR }}/${{ steps.jar_path.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  docker_build_push_ecr:
    name: Build & Push Docker image to ECR
    runs-on: ubuntu-latest
    needs: build_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: backend/api/target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          IMAGE_NAME=${{ secrets.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_BACKEND_REPOSITORY}}
          docker build -t $IMAGE_NAME:${{ github.sha }} backend/api
          docker build -t $IMAGE_NAME:latest backend/api

      - name: Push Docker Image
        run: |
          IMAGE_NAME=${{ secrets.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_BACKEND_REPOSITORY}}
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
