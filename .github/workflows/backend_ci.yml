name: BackEnd CI

on:
  workflow_call:

env:
  JAVA_VERSION: "21" # ou '17' selon le projet
  ARTIFACT_NAME: backend-jar
  WORKDIR: backend/api
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  AWS_REGION: ${{ secrets.AWS_REGION }}

  AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
  AWS_ECR_BACKEND_REPOSITORY: "normank/backend"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  compile-build:
    name: Compile & Build JAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Show versions
        run: |
          java -version
          ./mvnw -v || mvn -v

      - name: Compile & Package (skip tests)
        run: |
          chmod +x mvnw || true
          ./mvnw -B -ntp -DskipTests package || mvn -B -ntp -DskipTests package

      - name: Collect JAR path
        id: jar_path
        run: |
          FILE=$(ls -1 target/*.jar | head -n1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORKDIR }}/${{ steps.jar_path.outputs.file }}
          if-no-files-found: error
          retention-days: 2

  ###############################################################################################

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: compile-build
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORKDIR }}/target

      - name: Run Unit Tests
        run: |
          chmod +x mvnw || true
          ./mvnw -B -ntp test || mvn -B -ntp test

      - name: Upload JaCoCo coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKDIR }}/target/site/jacoco/
          retention-days: 2

  ###############################################################################################

  mutation-tests:
    name: Mutation Tests
    runs-on: ubuntu-latest
    needs: compile-build
    continue-on-error: true
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORKDIR }}/target

      - name: Run PIT Mutation Tests
        run: |
          chmod +x mvnw || true
          ./mvnw -B org.pitest:pitest-maven:mutationCoverage \
            -Dgit.commit.id.skip=true -Dspotless.check.skip=true

      - name: Upload mutation report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: ${{ env.WORKDIR }}/target/pit-reports/
          retention-days: 2

  ###############################################################################################

  integration_tests:
    name: Integration Tests (Backend)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_it"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Integration Tests (Failsafe)

        run: |
          chmod +x mvnw || true
          # utilise le profil 'integration' pour ne PAS relancer les UT
          ./mvnw -B -ntp verify -Pintegration || mvn -B -ntp verify -Pintegration

      - name: Upload IT reports (Surefire/Failsafe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-reports
          path: |
            ${{ env.WORKDIR }}/target/failsafe-reports/
            ${{ env.WORKDIR }}/target/surefire-reports/
          retention-days: 2

  # sec_backend_deps:
  #   runs-on: ubuntu-24.04
  #   defaults:
  #     run:
  #       working-directory: ${{ env.WORKDIR }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with: { distribution: temurin, java-version: "21", cache: maven }
  #     - name: OWASP Dependency-Check (rapide)
  #       run: mvn -B org.owasp:dependency-check-maven:check -DskipTests

  ###############################################################################################

  docker_build_push_ecr:
    name: Build & Push Docker image to ECR
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: backend/api/target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          IMAGE_NAME=${{ secrets.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_BACKEND_REPOSITORY}}
          docker build -t $IMAGE_NAME:${{ github.sha }} backend/api
        #   docker build -t $IMAGE_NAME:latest backend/api

      - name: Push Docker Image
        run: |
          IMAGE_NAME=${{ secrets.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_BACKEND_REPOSITORY}}
          docker push $IMAGE_NAME:${{ github.sha }}
        #   docker push $IMAGE_NAME:latest
