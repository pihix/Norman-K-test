name: Frontend CD

on:
  workflow_call:
    inputs:
      workdir:
        description: "Frontend working directory"
        required: false
        default: "frontend"
        type: string
      node_version:
        required: false
        default: "20"
        type: string
      pnpm_version:
        required: false
        default: "9.12.0"
        type: string
      cloudfront_invalidate:
        required: false
        default: false
        type: boolean
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

jobs:
  deploy_s3:
    name: Deploy static export to S3 (rotating buckets)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-frontend-s3
      cancel-in-progress: true

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    defaults:
      run:
        working-directory: ${{ inputs.workdir }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Restore pnpm store
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-export
          path: ${{ inputs.workdir }}/out

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Export build metadata
        run: |
          echo "NEXT_PUBLIC_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BUILD_DATE=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build (Next.js export)
        run: pnpm build:export

      - name: Compute rotating target bucket (v1-v2-v3)
        run: |
          N=${{ github.run_number }}
          INDEX=$(( (N - 1) % 3 + 1 ))
          echo "TARGET_BUCKET=normank-front-v$INDEX" >> $GITHUB_ENV
          echo "Deploying to normank-front-v$INDEX"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload immutable assets with long cache
        run: |
          aws s3 cp ./out s3://$TARGET_BUCKET/ \
            --recursive \
            --exclude "*" \
            --include "_next/static/*" \
            --include "assets/*" \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata-directive REPLACE

      - name: Upload HTML and others with short cache
        run: |
          aws s3 cp ./out s3://$TARGET_BUCKET/ \
            --recursive \
            --exclude "_next/*" \
            --exclude "assets/*" \
            --cache-control "public,max-age=60" \
            --metadata-directive REPLACE
