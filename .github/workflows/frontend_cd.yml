name: Frontend CD

on:
  workflow_call:
    inputs:
      workdir:
        description: "Frontend working directory"
        required: false
        default: "frontend"
        type: string
      node_version:
        required: false
        default: "20"
        type: string
      pnpm_version:
        required: false
        default: "9.12.0"
        type: string
      cloudfront_invalidate:
        required: false
        default: false
        type: boolean
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

jobs:
  scan_image:
    name: Scan Frontend Docker Image with Trivy
    runs-on: ubuntu-latest

    env:
      IMAGE_URI: ${{ secrets.AWS_ECR_REGISTRY }}/normank/frontend:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  ####################################################################################################

  deploy_s3:
    name: Deploy static export to S3 (rotating buckets)
    needs: scan_image
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-frontend-s3
      cancel-in-progress: true

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TARGET_BUCKET: "frontend-normank"

    defaults:
      run:
        working-directory: ${{ inputs.workdir }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Restore pnpm store
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-export
          path: ${{ inputs.workdir }}/out

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Export build metadata
        run: |
          echo "NEXT_PUBLIC_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BUILD_DATE=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CDN_URL=https://d4h4iqgtz3o.cloudfront.net" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload immutable assets with long cache
        run: |
          aws s3 cp ./out s3://$TARGET_BUCKET/ \
            --recursive \
            --exclude "*" \
            --include "_next/static/*" \
            --include "assets/*" \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata-directive REPLACE

      - name: Upload HTML and others with short cache
        run: |
          aws s3 cp ./out s3://$TARGET_BUCKET/ \
            --recursive \
            --exclude "_next/*" \
            --exclude "assets/*" \
            --cache-control "public,max-age=60" \
            --metadata-directive REPLACE

  ####################################################################################################

  deploy_ecs:
    name: Deploy Frontend on ECS
    runs-on: ubuntu-latest
    needs: scan_image

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      IMAGE_URI: ${{ secrets.AWS_ECR_REGISTRY }}/normank/frontend:${{ github.sha }}
      CLUSTER_NAME: cluster-ecs-normank
      SERVICE_NAME: service-ecs-front-normank
      CONTAINER_NAME: normank-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render new ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend/.aws/taskdef-frontend.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          cluster: ${{ env.CLUSTER_NAME }}
          service: ${{ env.SERVICE_NAME }}
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
