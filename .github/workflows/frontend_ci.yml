name: Frontend CI

on:
  push:
    branches: ["pipeline-frontend-CI-CD"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_ci.yaml"
  pull_request:
    branches: ["pipeline-frontend-CI-CD"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_ci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

  
env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: CI - Test & Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (LTS) + pnpm cache
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm via Corepack (pinned)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Next.js incremental build
        id: next-cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts','**/*.tsx','**/*.js','**/*.jsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache test artifacts (Jest)
        id: jest-cache
        uses: actions/cache@v4
        with:
          path: .cicache
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Typecheck, lint & tests (coverage)
        run: |
          pnpm typecheck
          pnpm lint:all
          pnpm test:coverage --cacheDirectory .cicache/jest