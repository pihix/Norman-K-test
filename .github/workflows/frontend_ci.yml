name: FrontEnd CI

on:
  workflow_call:

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  WORKDIR: frontend
jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .
          fetch-depth: 0

      - name: Setup Node.js (LTS) + pnpm cache
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Next.js incremental build
        id: next-cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts','**/*.tsx','**/*.js','**/*.jsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache test artifacts (Jest)
        id: jest-cache
        uses: actions/cache@v4
        with:
          path: .cicache
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Typecheck, lint & tests (coverage)
        run: |
          pnpm typecheck
          pnpm lint:all
          pnpm test:coverage --cacheDirectory .cicache/jest

      - name: Dead code detection (knip) on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        run: pnpm knip

      - name: Export build metadata
        run: |
          echo "NEXT_PUBLIC_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BUILD_DATE=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Check asset sizes
        run: pnpm check-filesize

      - name: Report Coverage
        uses: romeovs/lcov-reporter-action@v0.2.21
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: Export static site (for S3)
        run: pnpm build:export

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-export
          path: frontend/out
