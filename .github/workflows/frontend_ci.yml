name: Frontend CI

on:
  push:
    branches: ["pipeline-frontend-CI-CD"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_ci.yml"
  pull_request:
    branches: ["pipeline-frontend-CI-CD"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

  
env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  WORKDIR: frontend
  AWS_REGION: ${{ secrets.AWS_REGION }}
  
  AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
  AWS_ECR_FRONTEND_REPOSITORY: "normank/frontend"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    
    permissions:
        pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (LTS) + pnpm cache
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT


      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Next.js incremental build
        id: next-cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts','**/*.tsx','**/*.js','**/*.jsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache test artifacts (Jest)
        id: jest-cache
        uses: actions/cache@v4
        with:
          path: .cicache
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Typecheck, lint & tests (coverage)
        run: |
          pnpm typecheck
          pnpm lint:all
          pnpm test:coverage --cacheDirectory .cicache/jest

      - name: Dead code detection (knip) on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        run: pnpm knip

      - name: Export build metadata
        run: |
            echo "NEXT_PUBLIC_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_BUILD_DATE=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Check asset sizes
        run: pnpm check-filesize

      - name: Report Coverage
        uses: romeovs/lcov-reporter-action@v0.2.21
        continue-on-error: true
        with:
            github-token: ${{ github.token }}

      
  docker:
    name: Docker Build & Push to ECR
    runs-on: ubuntu-latest
    needs: build
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id:     ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
            aws-region:            ${{ secrets.AWS_REGION }}

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build, tag, and push Docker image
          env:
            REGISTRY:   ${{ secrets.AWS_ECR_REGISTRY }}
            REPOSITORY: ${{ env.AWS_ECR_FRONTEND_REPOSITORY }}
            IMAGE_TAG:  ${{ github.sha }}
          run: |
                echo "Building $REGISTRY/$REPOSITORY:$IMAGE_TAG"
                docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./frontend
                docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
